<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch API</title>
</head>
<body>
  <h1>Fetch API Post</h1>
  <button type="button" onclick="createPost()">Send Post Request</button>
  <p id="fetchResponse"></p>

  <script>
    const createPost = () => {

      fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",     // Τύπος αιτήματος
        headers: {
          "Content-Type": "application/json"      //  λέει στον server ότι τα δεδομένα είναι JSON.
        },
        body: JSON.stringify({  //το μετατρέπει σε string, ώστε να μπορεί να διαβαστεί από τον server.
            title: "Coding Factory",
            body: "Coding Factory says Hello",
            userId: 1
          }
        )
      })
      .then(response => {
        if(!response.ok) throw new Error(`HTTP Error. Status: ${response.status}`);   // Αν υπάρχει πρόβλημα, πετάει error
        return response.json();    // Αν όλα είναι ΟΚ, μετατρέπει την απάντηση σε JSON.
      })  
      .then(data => {
        document.getElementById('fetchResponse').innerHTML = `<b>Post Created</b>: ${data.title}`   // Εμφανίζει τον τίτλο του νέου post στη σελίδα.
      })
      .catch(error => {
        console.error("Error: ", error);    //Logging
        document.getElementById('fetchResponse').innerHTML = `Error.${error.message}`  //User-friendly localized feedback
      });
    }
  </script>

</body>
</html>
